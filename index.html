<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Tentmaker Open Capstone 1">

    <title>capstone-1</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HEADER -->

    <header class="site-header">

        <div class="container header-content">
            <div class="logo">MO</div>
            <div class="header-text"> 
                <p class="eybrow">My Organization</p>
            </div>

            
            <h1>Community Learning Hub 
            </h1>>
            <p class="subtitle"> Learn together. Grow together Stay connected.</p>
                
        </div>

    </header>
 <!-- Main CONTENT -->
  <main class="container">
     <!-- Welcome Section -->
<section class="Welcome-card">
    <div class="Welcome content">
        <p class="Welcome-label">
            Welcome to my organization
        </p>>

    </div>
</section>
  </main>

    <!-- NAVIGATION -->

    <nav class="navigation">

        <div class="container nav-container">

            <button
                class="nav-button active"
                data-view="People">
                Roster
            </button>

            <button
                class="nav-button"
                data-view="group">
                Group 
            </button>

            <button
                class="nav-button"
                data-view="leader">
                Leader Channel
            </button>

            <button
                class="nav-button"
                data-view="Post">
                History
            </button>

        </div>

    </nav>


    <!-- MAIN -->

    <main class="container">

        <!-- SELECTOR -->

        <section class="selector-section">

            <div id="picker"></div>

        </section>


        <!-- STATUS -->

        <div
            id="status"
            class="status"
            role="status"
            aria-live="polite">

            Loading data...

        </div>


        <!-- CONTENT -->

        <section
            id="content"
            class="content">

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="site-footer">

        <div class="container">

            <p>
                Tentmaker Open - Capstone 1
            </p>

        </div>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="app.js"></script>

</body>

</html>
